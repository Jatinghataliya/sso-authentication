name: CI/CD — Build & Deploy to Railway

on:
  push:
    branches:
      - main          # Deploy on every push to main
  pull_request:
    branches:
      - main          # Build + test on PRs (no deploy)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. jatinghataliya/sso-authentication

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & Test
  #   Compiles the project and runs tests on every push/PR.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (compile + test)
        run: mvn verify -q
        env:
          # Provide dummy values so Spring context starts during tests
          AUTH0_CLIENT_ID: test-client-id
          AUTH0_CLIENT_SECRET: test-client-secret
          AUTH0_DOMAIN: example.us.auth0.com
          GITHUB_CLIENT_ID: test-github-id
          GITHUB_CLIENT_SECRET: test-github-secret
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret

  # ─────────────────────────────────────────────────────────────
  # Job 2: Docker Build & Push to GHCR
  #   Builds the multi-stage Docker image and pushes to
  #   GitHub Container Registry. Only runs on push to main.
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build                  # Only runs if build passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write             # Required to push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided by GitHub

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-          # e.g. sha-abc1234
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha       # GitHub Actions cache
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to Railway
  #   Uses Railway CLI to trigger a new deployment with the
  #   freshly built image. Only runs after docker job succeeds.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://sso-authentication-production.up.railway.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service 82158c59-49fe-4f78-8e2e-4b4583c234ee
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
