<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin — SSO Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2328; }
        header { background: #1f2328; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; }
        header nav a { color: #ccc; text-decoration: none; margin-left: 16px; font-size: 14px; }
        header nav a:hover { color: #fff; }
        main { max-width: 760px; margin: 60px auto; padding: 0 24px; text-align: center; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 40px; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        p { color: #57606a; font-size: 15px; line-height: 1.6; }
        .badge { display: inline-block; background: #fff3cd; color: #856404; border: 1px solid #ffc107; border-radius: 4px; padding: 4px 12px; font-size: 13px; font-weight: 600; margin-top: 16px; }
        .btn { display: inline-block; margin-top: 24px; padding: 10px 24px; background: #1f2328; color: #fff; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <h1>🔐 SSO Demo</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</header>

<main>
    <div class="card">
        <div class="icon">🛡️</div>
        <h2>Admin Panel</h2>
        <p>Welcome, <strong th:text="${name}">Admin</strong>.<br/>
           You have accessed this page because your Okta account has the <strong>ADMIN</strong> role assigned.</p>
        <span class="badge">ROLE_ADMIN</span>
        <br/>
        <a class="btn" th:href="@{/dashboard}">← Back to Dashboard</a>
    </div>
</main>

</body>
</html>
