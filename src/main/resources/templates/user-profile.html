<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Profile — SSO Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2328; }
        header { background: #1f2328; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; }
        header nav a { color: #ccc; text-decoration: none; margin-left: 16px; font-size: 14px; }
        header nav a:hover { color: #fff; }
        main { max-width: 760px; margin: 60px auto; padding: 0 24px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 40px; }
        .avatar { width: 72px; height: 72px; background: #3b82d4; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 700; margin-bottom: 20px; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        p { color: #57606a; font-size: 14px; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        td { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        td:first-child { font-weight: 600; width: 120px; color: #57606a; }
        .badge { display: inline-block; background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 600; }
        .btn { display: inline-block; margin-top: 24px; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; background: #fff; color: #1f2328; border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

<header>
    <h1>🔐 SSO Demo</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/user/profile}">My Profile</a>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</header>

<main>
    <div class="card">
        <div class="avatar" th:text="${name != null ? name.substring(0,1).toUpperCase() : 'U'}">U</div>
        <h2 th:text="${name}">User Name</h2>
        <p>Authenticated user — <span th:text="${email}">email</span></p>
        <table>
            <tr><td>Name</td><td th:text="${name}">—</td></tr>
            <tr><td>Email</td><td th:text="${email}">—</td></tr>
            <tr><td>Role</td><td><span class="badge">USER</span></td></tr>
        </table>
        <a class="btn" th:href="@{/dashboard}">← Back to Dashboard</a>
    </div>
</main>

</body>
</html>
