<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Detail — SSO Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2328; }
        header { background: #1f2328; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; }
        header nav a { color: #ccc; text-decoration: none; margin-left: 16px; font-size: 14px; }
        header nav a:hover { color: #fff; }
        main { max-width: 760px; margin: 40px auto; padding: 0 24px; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 28px 32px; margin-bottom: 24px; }
        .card h3 { font-size: 13px; font-weight: 600; color: #57606a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: #3b82d4; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex-shrink: 0; }
        .profile-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-info p { font-size: 14px; color: #57606a; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        td { padding: 10px 0; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
        td:first-child { font-weight: 600; width: 160px; color: #57606a; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-auth0  { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }
        .badge-github { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
        .badge-google { background: #eff6ff; color: #1d4ed8; border: 1px solid #93c5fd; }
        .badge-admin  { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .badge-user   { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .role-form { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .radio-option input { accent-color: #3b82d4; width: 16px; height: 16px; cursor: pointer; }
        .btn { display: inline-block; padding: 9px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
        .btn-primary { background: #1f2328; color: #fff; }
        .btn-primary:hover { background: #3b82d4; }
        .btn-secondary { background: #fff; color: #1f2328; border: 1px solid #e5e7eb; }
        .btn-secondary:hover { background: #f7f8fa; }
        .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>

<header>
    <h1>🔐 SSO Demo</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/admin}">Admin</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</header>

<main>
    <div class="page-title">User Detail</div>

    <!-- Profile Card -->
    <div class="card">
        <h3>Profile</h3>
        <div class="profile-header">
            <div class="avatar"
                 th:text="${user.name != null and !user.name.isEmpty()} ? ${user.name.substring(0,1).toUpperCase()} : 'U'">U</div>
            <div class="profile-info">
                <h2 th:text="${user.name}">Name</h2>
                <p th:text="${user.email}">email@example.com</p>
            </div>
        </div>
        <table>
            <tr>
                <td>Provider</td>
                <td>
                    <span th:classappend="${user.provider == 'okta'} ? 'badge-auth0' : (${user.provider == 'github'} ? 'badge-github' : 'badge-google')"
                          class="badge"
                          th:text="${user.provider == 'okta'} ? 'Auth0' : (${user.provider == 'github'} ? 'GitHub' : 'Google')">—</span>
                </td>
            </tr>
            <tr>
                <td>Role</td>
                <td>
                    <span th:classappend="${user.role == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                          class="badge"
                          th:text="${user.role}">USER</span>
                </td>
            </tr>
            <tr>
                <td>Provider User ID</td>
                <td th:text="${user.providerUserId}">—</td>
            </tr>
            <tr>
                <td>Created At</td>
                <td th:text="${user.createdAt != null} ? ${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')} : '—'">—</td>
            </tr>
            <tr>
                <td>Last Login</td>
                <td th:text="${user.lastLoginAt != null} ? ${#temporals.format(user.lastLoginAt, 'dd MMM yyyy HH:mm')} : '—'">—</td>
            </tr>
        </table>
    </div>

    <!-- Role Management Card -->
    <div class="card">
        <h3>Role Management</h3>
        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
            <div class="role-form">
                <label class="radio-option">
                    <input type="radio" name="role" value="USER" th:checked="${user.role == 'USER'}"/>
                    <span>USER</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="role" value="ADMIN" th:checked="${user.role == 'ADMIN'}"/>
                    <span>ADMIN</span>
                </label>
                <button type="submit" class="btn btn-primary">Save Role</button>
            </div>
        </form>
    </div>

    <!-- Actions -->
    <div class="actions">
        <a class="btn btn-secondary" th:href="@{/admin/users}">← Back to Users List</a>
    </div>
</main>

</body>
</html>
