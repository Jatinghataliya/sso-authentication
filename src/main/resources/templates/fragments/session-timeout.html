<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Session Timeout Banner Fragment
  Include in any protected page with:
    <div th:replace="~{fragments/session-timeout :: sessionTimeoutBanner}"></div>
  Place it right after <body> or inside <main>.
-->
<div th:fragment="sessionTimeoutBanner">

    <!-- Warning banner — hidden by default, shown by JS when < 2 min remaining -->
    <div id="session-warning"
         style="display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
                background:#92400e; color:#fff; padding:12px 24px;
                display:none; align-items:center; justify-content:space-between;
                font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
        <span>
            ⚠ Your session will expire in
            <strong id="session-countdown">2:00</strong>.
            You will be automatically logged out.
        </span>
        <div style="display:flex; gap:10px;">
            <button onclick="extendSession()"
                    style="background:#fff; color:#92400e; border:none; padding:6px 16px;
                           border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;">
                Stay Logged In
            </button>
            <a th:href="@{/logout}"
               style="color:#fde68a; text-decoration:none; font-size:13px; padding:6px 0;">
                Logout Now
            </a>
        </div>
    </div>

    <!-- Session expired modal — shown when session has expired -->
    <div id="session-expired-modal"
         style="display:none; position:fixed; inset:0; z-index:10000;
                background:rgba(0,0,0,0.6); align-items:center; justify-content:center;
                font-family:-apple-system,'Segoe UI',sans-serif;">
        <div style="background:#fff; border-radius:8px; padding:36px 40px;
                    max-width:420px; width:90%; text-align:center;
                    box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div style="font-size:40px; margin-bottom:16px;">🔒</div>
            <h2 style="font-size:18px; font-weight:700; margin-bottom:8px; color:#1f2328;">
                Session Expired
            </h2>
            <p style="color:#57606a; font-size:14px; margin-bottom:24px; line-height:1.6;">
                Your session has expired due to inactivity.<br/>
                Please log in again to continue.
            </p>
            <a href="/"
               style="display:inline-block; background:#1f2328; color:#fff;
                      padding:10px 28px; border-radius:6px; text-decoration:none;
                      font-size:14px; font-weight:600;">
                Back to Login
            </a>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            var WARNING_THRESHOLD = 120;  // show warning when < 2 minutes remain
            var CHECK_INTERVAL    = 30000; // poll every 30 seconds
            var warningShown      = false;

            var warningEl = document.getElementById('session-warning');
            var expiredEl = document.getElementById('session-expired-modal');
            var countdownEl = document.getElementById('session-countdown');
            var countdownInterval = null;

            function formatTime(seconds) {
                var m = Math.floor(seconds / 60);
                var s = seconds % 60;
                return m + ':' + (s < 10 ? '0' + s : s);
            }

            function startCountdown(seconds) {
                var remaining = seconds;
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(function () {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(countdownInterval);
                        showExpired();
                        return;
                    }
                    if (countdownEl) countdownEl.textContent = formatTime(remaining);
                }, 1000);
                if (countdownEl) countdownEl.textContent = formatTime(remaining);
            }

            function showWarning(seconds) {
                if (!warningShown) {
                    warningShown = true;
                    warningEl.style.display = 'flex';
                    startCountdown(seconds);
                }
            }

            function showExpired() {
                warningEl.style.display = 'none';
                expiredEl.style.display = 'flex';
                // Redirect to home after 3 seconds
                setTimeout(function () { window.location.href = '/?expired=true'; }, 3000);
            }

            function checkSession() {
                fetch('/api/session-status')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (!data.active || data.secondsRemaining <= 0) {
                            showExpired();
                            return;
                        }
                        if (data.secondsRemaining <= WARNING_THRESHOLD) {
                            showWarning(data.secondsRemaining);
                        }
                    })
                    .catch(function () {
                        // Network error — session likely expired
                        showExpired();
                    });
            }

            // Extend session by making a lightweight request
            window.extendSession = function () {
                fetch('/api/session-status')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.active) {
                            warningShown = false;
                            warningEl.style.display = 'none';
                            if (countdownInterval) clearInterval(countdownInterval);
                        } else {
                            showExpired();
                        }
                    });
            };

            // Poll every 30 seconds
            setInterval(checkSession, CHECK_INTERVAL);
            // Also check immediately on page load
            checkSession();
        })();
    </script>
</div>

</body>
</html>
