<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard — SSO Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2328; }
        header { background: #1f2328; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: 600; }
        header nav a { color: #ccc; text-decoration: none; margin-left: 16px; font-size: 14px; }
        header nav a:hover { color: #fff; }
        main { max-width: 760px; margin: 40px auto; padding: 0 24px; }
        .welcome { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 28px 32px; margin-bottom: 24px; }
        .welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .welcome p { color: #57606a; font-size: 14px; }
        .avatar { width: 52px; height: 52px; background: #3b82d4; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px 32px; margin-bottom: 24px; }
        .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #57606a; text-transform: uppercase; letter-spacing: 0.05em; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        td { padding: 8px 0; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
        td:first-child { font-weight: 600; width: 160px; color: #57606a; }
        td:last-child { word-break: break-all; color: #1f2328; }
        .token-box { background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; word-break: break-all; color: #57606a; margin-top: 8px; }
        .badge-role { display: inline-block; background: #e8f0fe; color: #3b82d4; border-radius: 4px; padding: 2px 10px; font-size: 12px; font-weight: 600; margin-right: 6px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; }
        .btn-danger { background: #fff; color: #d1242f; border: 1px solid #d1242f; }
        .btn-danger:hover { background: #d1242f; color: #fff; }
        .btn-secondary { background: #fff; color: #1f2328; border: 1px solid #e5e7eb; margin-right: 10px; }
    </style>
</head>
<body>

<header>
    <h1>🔐 SSO Demo</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/dashboard}">Dashboard</a>
        <sec:authorize access="hasAuthority('ROLE_ADMIN')">
            <a th:href="@{/admin}">Admin</a>
        </sec:authorize>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</header>

<main>
    <!-- Welcome Card -->
    <div class="welcome">
        <div class="avatar" th:text="${name != null ? name.substring(0,1).toUpperCase() : 'U'}">U</div>
        <h2>Welcome, <span th:text="${name}">User</span>!</h2>
        <p>You are authenticated via <strong>Okta SSO</strong> using OpenID Connect.</p>
    </div>

    <!-- Profile Info -->
    <div class="card">
        <h3>Profile</h3>
        <table>
            <tr>
                <td>Full Name</td>
                <td th:text="${name}">—</td>
            </tr>
            <tr>
                <td>Email</td>
                <td th:text="${email}">—</td>
            </tr>
            <tr>
                <td>Subject (Okta ID)</td>
                <td th:text="${subject}">—</td>
            </tr>
            <tr>
                <td>Locale</td>
                <td th:text="${locale}">—</td>
            </tr>
        </table>
    </div>

    <!-- JWT Claims -->
    <div class="card">
        <h3>JWT Claims (from ID Token)</h3>
        <table>
            <tr th:each="entry : ${claims}">
                <td th:text="${entry.key}">key</td>
                <td th:text="${entry.value}">value</td>
            </tr>
        </table>
    </div>

    <!-- Actions -->
    <div>
        <a class="btn btn-secondary" th:href="@{/api/me}">View /api/me JSON</a>
        <a class="btn btn-danger" th:href="@{/logout}">Logout</a>
    </div>
</main>

</body>
</html>
