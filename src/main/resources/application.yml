server:
  port: ${SERVER_PORT:8081}
  # Trust X-Forwarded-Proto from Railway's reverse proxy so redirect URIs use https://
  forward-headers-strategy: NATIVE

spring:
  application:
    name: sso-demo

  security:
    oauth2:
      client:
        registration:
          # ── Provider 1: Auth0 (OIDC) ──────────────────────────────
          okta:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - offline_access
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/okta"

          # ── Provider 2: GitHub (OAuth2) ───────────────────────────
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

          # ── Provider 3: Google (OIDC) ─────────────────────────────
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            # NOTE: no offline_access — Google requires special approval for refresh tokens
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

        provider:
          okta:
            issuer-uri: https://${AUTH0_DOMAIN}/
            user-name-attribute: email
          # google provider is built-in — Spring Boot auto-configures it

  thymeleaf:
    cache: false

# App-level config (used in logout redirect, etc.)
app:
  base-url: ${APP_BASE_URL:http://localhost:8081}

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    com.example.sso: DEBUG
