server:
  port: ${SERVER_PORT:8081}
  # Trust X-Forwarded-Proto from Railway's reverse proxy so redirect URIs use https://
  forward-headers-strategy: NATIVE
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}   # default 30 min; override via env var

spring:
  application:
    name: sso-demo

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:ssodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  h2:
    console:
      enabled: ${H2_CONSOLE:false}

  security:
    oauth2:
      client:
        registration:
          # ── Provider 1: Auth0 (OIDC) ──────────────────────────────
          okta:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - offline_access
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/okta"

          # ── Provider 2: GitHub (OAuth2) ───────────────────────────
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

          # ── Provider 3: Google (OIDC) ─────────────────────────────
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            # NOTE: no offline_access — Google requires special approval for refresh tokens
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

        provider:
          okta:
            issuer-uri: https://${AUTH0_DOMAIN}/
            user-name-attribute: email
          # google provider is built-in — Spring Boot auto-configures it

  thymeleaf:
    cache: false

# ── Spring Boot Actuator ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized   # full details only for authenticated users
      show-components: when-authorized
  info:
    env:
      enabled: true

# App info shown at /actuator/info
info:
  app:
    name: SSO Demo
    description: Spring Boot Multi-Provider SSO (Auth0, GitHub, Google)
    version: 1.0.0
    java-version: ${java.version}

# App-level config (used in logout redirect, etc.)
app:
  base-url: ${APP_BASE_URL:http://localhost:8081}

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    com.example.sso: DEBUG
