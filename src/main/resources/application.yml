server:
  port: 8081

spring:
  application:
    name: sso-demo

  security:
    oauth2:
      client:
        registration:
          # ── Provider 1: Auth0 (OIDC) ──────────────────────────────
          okta:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - offline_access
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/okta"

          # ── Provider 2: GitHub (OAuth2) ───────────────────────────
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

        provider:
          okta:
            issuer-uri: https://${AUTH0_DOMAIN}/
            user-name-attribute: email

  thymeleaf:
    cache: false

# Logging (helpful during development)
logging:
  level:
    org.springframework.security: DEBUG
    com.example.sso: DEBUG
