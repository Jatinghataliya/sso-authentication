server:
  port: 8081

spring:
  application:
    name: sso-okta

  security:
    oauth2:
      client:
        registration:
          okta:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - offline_access
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/okta"
        provider:
          okta:
            issuer-uri: https://${AUTH0_DOMAIN}/
            user-name-attribute: email

  thymeleaf:
    cache: false

# Logging (helpful during development)
logging:
  level:
    org.springframework.security: DEBUG
    com.example.sso: DEBUG
